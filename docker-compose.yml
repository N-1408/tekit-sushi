# Lokal sinov uchun: ilova + Postgres
#   docker compose up -d
#   http://localhost:3000
# Ishlab chiqarishda DATABASE_URL ni haqiqiy serverga qarab o'zgartiring.
services:
  app:
    build: ./miniapp
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://tekit:tekitparol@db:5432/tekit
      DATABASE_SSL: off              # lokal Postgresda SSL yo'q
      BOT_TOKEN: ${BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-tekitwebhook2026}
      WEBAPP_URL: ${WEBAPP_URL:-http://localhost:3000/}
      WEBAPP_ORIGIN: ${WEBAPP_ORIGIN:-http://localhost:3000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tekit
      POSTGRES_PASSWORD: tekitparol
      POSTGRES_DB: tekit
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
volumes:
  pgdata:
