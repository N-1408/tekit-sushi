<!DOCTYPE html>
<html lang="uz">
<head>
  <script>
    try {
      var m = localStorage.getItem('tk-theme');
      var d = m ? m === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = d ? 'dark' : 'light';
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', d ? '#0F1720' : '#F6F7FB');
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0A2194" />
<title>Tekit Sushi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="root"></div>
<script>
    // Eskirgan HTML eski chunk nomini ko'rsa, import HTML sifatida 200 qaytadi va
    // modul yuklanmaydi. Bitta cheklangan tiklanish: sessiyada bir marta reload.
    (function () {
      try {
        window.addEventListener('error', function (e) {
          var t = e && e.target
          if (!t || t.tagName !== 'SCRIPT') return
          if (sessionStorage.getItem('tk-boot-retry')) return
          try { sessionStorage.setItem('tk-boot-retry', '1') } catch (err) {}
          location.reload()
        }, true)
      } catch (err) {}
    })()
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
