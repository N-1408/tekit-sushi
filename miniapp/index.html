<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tekit Sushi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#F6F4F0; --card:#FFFFFF; --ink:#191512; --ink2:#6F675E; --ink3:#A39B90;
  --acc:#E23B22; --acc2:#FF5A3C; --accsoft:#FDEDE8; --line:#ECE7E0; --ok:#1E9E4A;
  --r:18px; --eo:cubic-bezier(.23,1,.32,1); --dr:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--ink); overscroll-behavior-y:contain;
  letter-spacing:-.01em; user-select:none; -webkit-user-select:none;
}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.hide{display:none!important}

/* ---------- header ---------- */
#hdr{
  position:sticky;top:0;z-index:40;background:rgba(246,244,240,.82);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  padding:calc(10px + var(--sat)) 16px 10px;
  border-bottom:1px solid transparent; transition:border-color .3s var(--eo);
}
#hdr.sc{border-color:var(--line)}
.hrow{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.logo .mk{
  width:38px;height:38px;border-radius:12px;background:var(--acc);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:17px;letter-spacing:-.04em;
  box-shadow:0 6px 16px -6px rgba(226,59,34,.55);
}
.logo h1{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.logo p{font-size:11px;color:var(--ink3);font-weight:500;margin-top:1px}
.langs{display:flex;background:#EDE9E2;border-radius:11px;padding:3px;gap:2px}
.langs button{
  font-size:11px;font-weight:700;padding:5px 9px;border-radius:9px;color:var(--ink2);
  transition:background .25s var(--eo),color .25s var(--eo),transform .15s var(--eo);
}
.langs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.langs button:active{transform:scale(.93)}

#srch{margin-top:10px;position:relative}
#srch svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3)}
#sinput{
  width:100%;border:0;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:11px 36px 11px 38px;font-size:14.5px;font-weight:500;color:var(--ink);
  outline:none;transition:border-color .25s var(--eo),box-shadow .25s var(--eo);
}
#sinput:focus{border-color:#E8C9C2;box-shadow:0 0 0 4px var(--accsoft)}
#sinput::placeholder{color:var(--ink3)}
#sx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--ink3);background:transparent}
#sx:active{background:#F0EBE4}

/* ---------- chips ---------- */
#chips{
  position:sticky;top:calc(102px + var(--sat));z-index:35;display:flex;gap:8px;
  overflow-x:auto;padding:10px 16px 12px;background:linear-gradient(var(--bg) 78%,transparent);
  scrollbar-width:none;
}
#chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;font-size:13px;font-weight:600;padding:9px 15px;border-radius:13px;
  background:#fff;border:1px solid var(--line);color:var(--ink2);white-space:nowrap;
  transition:all .3s var(--eo);
}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 6px 14px -6px rgba(25,21,18,.4)}

/* ---------- hero ---------- */
#hero{padding:2px 16px 4px}
.hwrap{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:20px}
.hwrap::-webkit-scrollbar{display:none}
.hcard{
  flex:0 0 100%;scroll-snap-align:center;position:relative;border-radius:20px;overflow:hidden;
  aspect-ratio:16/8.2;background:#222;color:#fff;
}
.hcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hgrad{position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,10,9,.82) 22%,rgba(12,10,9,.25) 62%,rgba(12,10,9,0) 90%)}
.hin{position:absolute;left:18px;top:50%;transform:translateY(-50%);right:40%}
.hin .k{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#FFC9BF;margin-bottom:6px}
.hin h2{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-bottom:4px}
.hin p{font-size:12px;color:rgba(255,255,255,.75);font-weight:500}
.hdots{display:flex;gap:5px;justify-content:center;margin-top:10px}
.hdots i{width:6px;height:6px;border-radius:50%;background:#D8D2C9;transition:all .3s var(--eo)}
.hdots i.on{width:16px;border-radius:4px;background:var(--ink)}

/* ---------- sections / grid ---------- */
#menu{padding:2px 16px calc(110px + var(--sab))}
.sec{padding-top:18px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sechead h3{font-size:19px;font-weight:800;letter-spacing:-.02em}
.sechead span{font-size:12px;color:var(--ink3);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(min-width:470px){.grid{grid-template-columns:repeat(3,1fr)}}
.pcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  display:flex;flex-direction:column;position:relative;
  transition:transform .2s var(--eo),box-shadow .3s var(--eo);
  animation:pop .5s var(--eo) backwards;
}
.pcard:active{transform:scale(.975)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1}}
.pimg{position:relative;aspect-ratio:1;background:#EFECE6;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s var(--eo)}
.pimg img.ld{opacity:1}
.pimg .tag{
  position:absolute;top:9px;left:9px;font-size:9.5px;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;background:var(--acc);color:#fff;padding:4px 8px;border-radius:8px;
}
.pbody{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1}
.pname{font-size:13.5px;font-weight:700;line-height:1.25;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.pw{font-size:11px;color:var(--ink3);font-weight:600;margin-top:2px}
.pfoot{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
.price{font-size:14.5px;font-weight:800;letter-spacing:-.02em}
.price i{font-style:normal;font-size:11px;font-weight:700;color:var(--ink2)}
.addbtn{
  width:32px;height:32px;border-radius:11px;background:var(--acc);color:#fff;font-size:19px;font-weight:600;
  display:grid;place-items:center;line-height:1;
  box-shadow:0 5px 12px -4px rgba(226,59,34,.55);
  transition:transform .18s var(--spring),background .2s var(--eo);
}
.addbtn:active{transform:scale(.85)}
.addbtn.q{background:var(--ink);box-shadow:none;font-size:13px;font-weight:700}
.empty{padding:60px 30px;text-align:center;color:var(--ink3);font-weight:600;font-size:14px}
.empty b{display:block;font-size:42px;margin-bottom:10px;opacity:.5}

/* ---------- sheet ---------- */
#ov{position:fixed;inset:0;background:rgba(20,15,12,.45);z-index:50;opacity:0;transition:opacity .35s var(--eo);backdrop-filter:blur(2px)}
#ov.on{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);
  border-radius:26px 26px 0 0;transform:translateY(103%);
  transition:transform .5s var(--dr);max-height:88dvh;display:flex;flex-direction:column;
  box-shadow:0 -20px 60px rgba(20,15,12,.2);
}
.sheet.on{transform:translateY(0)}
.grab{width:40px;height:5px;border-radius:3px;background:#D8D2C9;margin:9px auto 2px;flex:0 0 auto}
.shead{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 4px;flex:0 0 auto}
.shead h3{font-size:18px;font-weight:800;letter-spacing:-.02em}
.xbtn{width:30px;height:30px;border-radius:50%;background:#EDE9E2;display:grid;place-items:center;color:var(--ink2);transition:transform .18s var(--eo)}
.xbtn:active{transform:scale(.88)}
.sbody{overflow-y:auto;padding:12px 20px 20px;-webkit-overflow-scrolling:touch}
.sfoot{flex:0 0 auto;padding:12px 20px calc(14px + var(--sab));background:linear-gradient(rgba(246,244,240,0),var(--bg) 30%)}

/* product sheet */
#pd-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:20px;background:#EFECE6}
.pd-t{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:14px 0 3px;line-height:1.2}
.pd-d{font-size:13.5px;color:var(--ink2);line-height:1.55;font-weight:500;white-space:pre-line}
.pd-row{display:flex;align-items:center;justify-content:space-between;margin:16px 0 4px}
.qty{display:flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:4px}
.qty button{width:34px;height:34px;border-radius:10px;font-size:18px;font-weight:700;color:var(--ink);display:grid;place-items:center;transition:transform .15s var(--eo),background .2s}
.qty button:active{transform:scale(.82);background:#F0EBE4}
.qty span{min-width:30px;text-align:center;font-size:15px;font-weight:800}
.totline{font-size:15px;font-weight:800}

/* cart */
.citem{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:9px;animation:pop .35s var(--eo) backwards}
.citem img{width:62px;height:62px;border-radius:12px;object-fit:cover;flex:0 0 auto;background:#EFECE6}
.cmid{flex:1;min-width:0}
.cmid .n{font-size:13.5px;font-weight:700;line-height:1.25}
.cmid .p{font-size:13px;color:var(--ink2);font-weight:700;margin-top:3px}
.rm{color:var(--ink3);padding:6px;transition:transform .15s var(--eo)}
.rm:active{transform:scale(.85);color:var(--acc)}
.bigbtn{
  width:100%;padding:15px;border-radius:16px;background:var(--acc);color:#fff;font-size:15.5px;font-weight:800;
  letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 10px 22px -8px rgba(226,59,34,.6);
  transition:transform .18s var(--eo),opacity .2s;
}
.bigbtn:active{transform:scale(.97)}
.bigbtn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.bigbtn:disabled{opacity:.45}
.bigbtn span.b{font-size:14px;opacity:.9}

/* checkout */
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;font-weight:700;color:var(--ink2);letter-spacing:.02em;margin:0 2px 6px;text-transform:uppercase}
.fld input,.fld select,.fld textarea{
  width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  font-size:14.5px;font-weight:500;color:var(--ink);outline:none;transition:border-color .25s var(--eo),box-shadow .25s var(--eo);
  -webkit-appearance:none;appearance:none;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:#E8C9C2;box-shadow:0 0 0 4px var(--accsoft)}
.seg{display:flex;background:#EDE9E2;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:11px;font-size:13.5px;font-weight:700;color:var(--ink2);transition:all .3s var(--eo)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.09)}
.seg button:active{transform:scale(.96)}

/* success */
#okbox{text-align:center;padding:28px 12px 10px}
#okbox .ring{width:76px;height:76px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 16px;animation:zpop .55s var(--spring) both}
@keyframes zpop{from{transform:scale(0)}to{transform:scale(1)}}
#okbox h3{font-size:20px;font-weight:800;margin-bottom:6px}
#okbox p{font-size:13.5px;color:var(--ink2);font-weight:500;line-height:1.5}

/* ---------- bottom nav ---------- */
#nav{
  position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;background:rgba(255,255,255,.9);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding:7px 10px calc(7px + var(--sab));
}
.nbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);font-size:10.5px;font-weight:700;transition:color .25s var(--eo)}
.nbtn.on{color:var(--ink)}
.nbtn:active{transform:scale(.94)}
.nbtn .ic{position:relative;transition:transform .25s var(--spring)}
.nbtn.on .ic{transform:translateY(-1px)}
.nbadge{
  position:absolute;top:-7px;right:-11px;min-width:17px;height:17px;border-radius:9px;background:var(--acc);color:#fff;
  font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid #fff;
  transform:scale(0);transition:transform .3s var(--spring);
}
.nbadge.on{transform:scale(1)}
#nav .cart-wrap{position:relative}

/* toast */
#toast{
  position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translate(-50%,16px) scale(.9);z-index:80;
  background:#221D19;color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:14px;
  opacity:0;pointer-events:none;transition:all .4s var(--eo);white-space:nowrap;box-shadow:0 12px 30px rgba(0,0,0,.25);
}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header id="hdr">
  <div class="hrow">
    <div class="logo">
      <div class="mk">TS</div>
      <div><h1 data-t="brand">Tekit Sushi</h1><p data-t="slog">Yapon taomi · yangi va tez</p></div>
    </div>
    <div class="langs" id="langs">
      <button data-l="uz" class="on">UZ</button><button data-l="ru">RU</button><button data-l="en">EN</button>
    </div>
  </div>
  <div id="srch">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="sinput" data-ph="qsearch" placeholder="Menyudan izlash...">
    <button id="sx" class="hide"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
</header>

<div id="chips"></div>
<div id="hero"><div class="hwrap" id="hwrap"></div><div class="hdots" id="hdots"></div></div>
<main id="menu"></main>

<div id="ov"></div>

<div class="sheet" id="pd">
  <div class="grab"></div>
  <div class="shead"><h3 data-t="dishes">Mahsulot</h3><button class="xbtn" data-x="pd"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="sbody">
    <img id="pd-img" alt="">
    <div class="pd-t" id="pd-t"></div>
    <div class="pd-d" id="pd-d"></div>
  </div>
  <div class="sfoot">
    <div class="pd-row" style="margin:0 0 12px">
      <div class="qty">
        <button id="pd-m">&minus;</button><span id="pd-q">1</span><button id="pd-p">+</button>
      </div>
      <div class="totline" id="pd-price"></div>
    </div>
    <button class="bigbtn" id="pd-add"><span data-t="addcart">Savatga qo'shish</span><span class="b" id="pd-sum"></span></button>
  </div>
</div>

<div class="sheet" id="cart">
  <div class="grab"></div>
  <div class="shead"><h3 data-t="cart">Savat</h3><button class="xbtn" data-x="cart"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="sbody" id="cart-items"></div>
  <div class="sfoot" id="cart-foot"></div>
</div>

<div class="sheet" id="co">
  <div class="grab"></div>
  <div class="shead"><h3 data-t="checkout">Buyurtmani rasmiylashtirish</h3><button class="xbtn" data-x="co"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="sbody" id="co-body"></div>
  <div class="sfoot" id="co-foot"></div>
</div>

<div class="sheet" id="done" style="max-height:80dvh">
  <div class="grab"></div>
  <div id="okbox"></div>
  <div class="sfoot"><button class="bigbtn ghost" data-x="done" data-t="cont">Menyuga qaytish</button></div>
</div>

<div id="toast"></div>

<nav id="nav">
  <button class="nbtn on" id="tab-menu">
    <span class="ic"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h10"/></svg></span>
    <span data-t="menu">Menyu</span>
  </button>
  <button class="nbtn" id="tab-cart">
    <span class="ic cart-wrap">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.7 8.5a2 2 0 0 1-2 1.5H9.2a2 2 0 0 1-2-1.6L5.3 3.7A1 1 0 0 0 4.3 3H2"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg>
      <span class="nbadge" id="cart-badge">0</span>
    </span>
    <span data-t="cart">Savat</span>
  </button>
  <button class="nbtn" id="tab-ord">
    <span class="ic"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v15H4z"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></span>
    <span data-t="orders">Buyurtmalar</span>
  </button>

/* ---------- i18n apply ---------- */
function applyLang(){
  document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=tt(el.dataset.t)});

/* ---------- hero ---------- */
function buildHero(){
  const w=$("#hwrap"),d=$("#hdots"); w.innerHTML="";d.innerHTML="";
  HERO.forEach((h,i)=>{
    if(!h.img) return;
    w.insertAdjacentHTML("beforeend",`<div class="hcard" data-i="${i}">
      <img src="${h.img.img}" loading="lazy" alt=""><div class="hgrad"></div>
      <div class="hin"><div class="k">${{set:{uz:"Set",ru:"Сет",en:"Set"},hit:{uz:"Xit",ru:"Хит",en:"Hit"},new:{uz:"Yangi",ru:"Новое",en:"New"}}[h.k][LANG]}</div>
      <h2>${h.t[LANG]||h.t.uz}</h2><p>${h.d[LANG]||h.d.uz}</p></div></div>`);
    d.insertAdjacentHTML("beforeend",`<i${i===0?' class="on"':""}></i>`);
  });
  w.addEventListener("scroll",()=>{
    const i=Math.round(w.scrollLeft/w.clientWidth);
    if(i!==heroIdx){heroIdx=i;[...d.children].forEach((x,j)=>x.classList.toggle("on",j===i))}
  },{passive:true});
}

/* ---------- chips ---------- */
function buildChips(){
  const c=$("#chips");
  let html=`<button class="chip on" data-c="all">${LANG==="ru"?"Всё":LANG==="en"?"All":"Barchasi"}</button>`;
  CATS.forEach(k=>{ if(menuByCat[k.id]?.length) html+=`<button class="chip" data-c="${k.id}">${k.emoji} ${k[LANG]||k.uz}</button>`; });
  c.innerHTML=html;
  c.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    curCat=b.dataset.c; q=""; $("#sinput").value=""; $("#sx").classList.add("hide");
    c.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));
    render();
    const target=curCat==="all"?0:($("#sec-"+curCat)?.offsetTop||0);
    window.scrollTo({top:Math.max(0,target-140),behavior:"smooth"});
  });
}

function money(n){return fmt(n)+' <i>soʻm</i>'}
function imgTag(p,cls){return `<img src="${CDN}${p.img}" loading="lazy" alt="" onload="this.classList.add('ld')">`}

function render(){
  const m=$("#menu"); let html="";
  const ql=q.trim().toLowerCase();
  const cats=ql?CATS.filter(c=>true):CATS;
  let found=0;
  if(ql){
    const hits=MENU.filter(p=>p._q.includes(ql));
    found=hits.length;
    if(found) html+=secHTML({uz:"Natijalar",ru:"Результаты",en:"Results"}[LANG],hits,"sr");
    if(!found) html=`<div class="empty"><b>🍳</b>${tt("searched")}</div>`;
  } else {
    if(curCat==="all"){
      CATS.forEach(c=>{
        const list=menuByCat[c.id]; if(!list?.length) return;
        html+=secHTML((c[LANG]||c.uz),list,c.id,true);
      });
    } else {
      const c=CATS.find(x=>x.id===curCat), list=menuByCat[curCat]||[];
      html=secHTML((c[LANG]||c.uz),list,curCat,true);
    }
  }
  m.innerHTML=html;
  m.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>openPD(el.dataset.open));
  m.querySelectorAll(".addbtn[data-quick]").forEach(b=>b.onclick=e=>{e.stopPropagation();addToCart(b.dataset.quick,1);toast(tt("added"))});
  paintQuickBtns();
}

function secHTML(title,list,catId,count){
  const sec = catId!=="sr"?`id="sec-${catId}"`:"";
  let h=`<section class="sec" ${sec}><div class="sechead"><h3>${title}</h3>${count?`<span>${list.length}</span>`:""}</div><div class="grid">`;
  list.forEach((p,i)=>{
    h+=`<article class="pcard" data-open="${p.id}" style="animation-delay:${Math.min(i*35,300)}ms">
      <div class="pimg">${imgTag(p)}${p.hit?'<span class="tag">'+tt("hit")+'</span>':""}</div>
      <div class="pbody">
        <div class="pname">${pT(p)}</div>
        <div class="pw">${p.pcs?p.pcs+" "+tt("pcs_w"):""}</div>
        <div class="pfoot"><div class="price">${fmt(p.price)} <i>soʻm</i></div>
        <button class="addbtn" data-quick="${p.id}">+</button></div>
      </div></article>`;
  });
  return h+`</div></section>`;
}

  pdQty=1;
  $("#pd-img").src=CDN+pdItem.img;
  $("#pd-t").textContent=pT(pdItem);
  $("#pd-d").textContent=pD(pdItem)||"—";
  updPD();
  openSheet("pd");
}
function updPD(){
  $("#pd-q").textContent=pdQty;
  const sum=pdQty*pdItem.price;
  $("#pd-price").innerHTML=money(pdItem.price);
  $("#pd-sum").textContent=fmt(sum)+" soʻm";
}
$("#pd-m").onclick=()=>{if(pdQty>1){pdQty--;updPD()}};
$("#pd-p").onclick=()=>{pdQty++;updPD()};
$("#pd-add").onclick=()=>{addToCart(pdItem.id,pdQty);closeSheet("pd");toast(tt("added"))};

/* ---------- cart ---------- */
function addToCart(id,q){
  cart[id]=(cart[id]||0)+q; saveCart(); paintBadge();
}
function saveCart(){localStorage.setItem("ts-cart",JSON.stringify(cart))}
function cartList(){return Object.entries(cart).map(([id,q])=>({p:MENU.find(x=>x.id===id),q})).filter(x=>x.p)}
function cartSum(){return cartList().reduce((s,x)=>s+x.p.price*x.q,0)}
function paintBadge(){
  const n=cartList().reduce((s,x)=>s+x.q,0), b=$("#cart-badge");
  b.textContent=n; b.classList.toggle("on",n>0);
  const qc=$(".addbtn.q"); if(qc){qc.style.transform="scale(.8)";setTimeout(()=>qc.style.transform="",150)}
}
function paintQuickBtns(){
  document.querySelectorAll(".addbtn[data-quick]").forEach(b=>{
    const n=cart[b.dataset.quick]||0;
    b.classList.toggle("q",n>0); b.textContent=n>0?n:"+";
  });
}
function renderCart(){
  const list=cartList(), items=$("#cart-items"), foot=$("#cart-foot");
  if(!list.length){
    items.innerHTML=`<div class="empty"><b>🛒</b>${tt("emptycart")}<br><small style="font-weight:500">${tt("addfrom")}</small></div>`;
    foot.innerHTML=""; return;
  }
  items.innerHTML=list.map((x,i)=>`<div class="citem" style="animation-delay:${i*40}ms">
    <img src="${CDN+x.p.img}" alt="">
    <div class="cmid"><div class="n">${pT(x.p)}</div><div class="p">${fmt(x.p.price*x.q)} soʻm</div></div>
    <div class="qty" style="border-radius:11px">
      <button data-dec="${x.p.id}">&minus;</button><span>${x.q}</span><button data-inc="${x.p.id}">+</button>
    </div></div>`).join("");
  foot.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:11px">
      <span style="font-size:13px;color:var(--ink2);font-weight:600">${tt("total")}</span>
      <span class="totline" style="font-size:17px">${fmt(cartSum())} soʻm</span></div>
    <button class="bigbtn" id="go-co"><span>${tt("toorder")}</span></button>
    <button class="bigbtn ghost" id="clr" style="margin-top:8px;padding:11px;font-size:13px">${tt("clear")}</button>`;
  items.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>{cart[b.dataset.inc]++;saveCart();renderCart();paintBadge();paintQuickBtns()});
  items.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>{const id=b.dataset.dec;cart[id]--;if(cart[id]<=0)delete cart[id];saveCart();renderCart();paintBadge();paintQuickBtns()});
  $("#go-co").onclick=()=>{closeSheet("cart");openCo()};
  $("#clr").onclick=()=>{cart={};saveCart();renderCart();paintBadge();paintQuickBtns()};
}

/* ---------- checkout ---------- */
let coMode="delivery", coPay="cash";
function openCo(){
  const b=$("#co-body");
  b.innerHTML=`
    <div class="fld"><label>${tt("mode")}</label>
      <div class="seg"><button id="m-d" class="${coMode==="delivery"?"on":""}">${tt("delivery")}</button><button id="m-p" class="${coMode==="pickup"?"on":""}">${tt("pickup")}</button></div></div>
    <div class="fld"><label>${tt("fio")}</label><input id="f-name" placeholder="${LANG==="ru"?"Иван Иванов":LANG==="en"?"John Doe":"Ali Valiyev"}" value="${localStorage.getItem("ts-name")||""}"></div>
    <div class="fld"><label>${tt("phone")}</label><input id="f-phone" inputmode="tel" placeholder="+998 90 123 45 67" value="${localStorage.getItem("ts-phone")||""}"></div>
    <div id="co-addr"></div>
    <div class="fld"><label>${tt("pay")}</label>
      <div class="seg"><button id="p-c" class="${coPay==="cash"?"on":""}">${tt("cash")}</button><button id="p-k" class="${coPay==="card"?"on":""}">${tt("card")}</button></div></div>
    <div class="fld"><label>${tt("note")}</label><textarea id="f-note" rows="2" style="resize:none"></textarea></div>`;
  const addrWrap=$("#co-addr");
  function paintAddr(){
    addrWrap.innerHTML = coMode==="delivery"
      ?`<div class="fld"><label>${tt("addr")}</label><input id="f-addr" placeholder="${LANG==="ru"?"Улица, дом, квартира":LANG==="en"?"Street, house, apt":"Ko'cha, uy, xonadon"}" value="${localStorage.getItem("ts-addr")||""}"></div>`
      :`<div class="fld"><label>${tt("branch")}</label><select id="f-branch">${BRANCHES.map(x=>`<option>${x}</option>`).join("")}</select></div>`;
  }
  paintAddr();
  $("#m-d").onclick=()=>{coMode="delivery";$("#m-d").classList.add("on");$("#m-p").classList.remove("on");paintAddr()};
  $("#m-p").onclick=()=>{coMode="pickup";$("#m-p").classList.add("on");$("#m-d").classList.remove("on");paintAddr()};
  $("#p-c").onclick=()=>{coPay="cash";$("#p-c").classList.add("on");$("#p-k").classList.remove("on")};
  $("#p-k").onclick=()=>{coPay="card";$("#p-k").classList.add("on");$("#p-c").classList.remove("on")};
  $("#co-foot").innerHTML=`<button class="bigbtn" id="place"><span>${tt("place")}</span><span class="b">${fmt(cartSum())} soʻm</span></button>`;
  $("#place").onclick=placeOrder;
  openSheet("co");
}

async function placeOrder(){
  const name=$("#f-name").value.trim(), phone=$("#f-phone").value.trim();
  const addr=coMode==="delivery"?($("#f-addr")?.value.trim()||""):($("#f-branch")?.value||BRANCHES[0]);
  if(!name||phone.replace(/\D/g,"").length<9){toast(LANG==="ru"?"Заполните имя и телефон":LANG==="en"?"Fill in name and phone":"Ism va telefon raqamini kiriting");return}
  const btn=$("#place"); btn.disabled=true;
  btn.innerHTML=`<span><i class="spin"></i>${LANG==="ru"?"Отправка...":LANG==="en"?"Sending...":"Yuborilmoqda..."}</span>`;
  const items=cartList().map(x=>`${x.q}× ${pT(x.p)} — ${fmt(x.p.price*x.q)}`);
  const order={type:"order",id:"TS"+Date.now().toString(36).toUpperCase().slice(-6),
    name,phone,mode:coMode,addr,pay:coPay==="cash"?tt("cash"):tt("card"),items,sum:cartSum(),
    at:new Date().toLocaleString("uz-UZ")};
  localStorage.setItem("ts-name",name);localStorage.setItem("ts-phone",phone);
  if(coMode==="delivery")localStorage.setItem("ts-addr",addr);
  let ok=false, oid=order.id;
  try{
    const r=await fetch("/api/order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...order,tg_user_id:tg?.initDataUnsafe?.user?.id||null,name,phone,address:addr,branch:coMode==="pickup"?addr:null,delivery_type:coMode,payment:coPay,total:order.sum})});
    if(r.ok){const j=await r.json(); ok=true; if(j.order_id) oid="#"+j.order_id;}
  }catch(e){}
  try{tg?.sendData(JSON.stringify(order))}catch(e){}
  if(!ok){ /* web_app_data path already fired; still show success */ }
  saveMyOrder({...order,oid,ok});
  cart={};saveCart();paintBadge();paintQuickBtns();
  $("#okbox").innerHTML=`<div class="ring"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h3>${tt("okt")}</h3><p>${tt("okd")}<br><b style="color:var(--ink)">${oid}</b></p>`;
  closeSheet("co"); openSheet("done");
  btn.disabled=false; btn.innerHTML=`<span>${tt("place")}</span>`;
}

/* ---------- orders ---------- */
function saveMyOrder(o){
  const arr=JSON.parse(localStorage.getItem("ts-ords")||"[]"); arr.unshift(o);
  localStorage.setItem("ts-ords",JSON.stringify(arr.slice(0,30)));
}
function renderOrders(){
  const m=$("#menu");
  const arr=JSON.parse(localStorage.getItem("ts-ords")||"[]");
  if(!arr.length){m.innerHTML=`<div class="empty"><b>🧾</b>${tt("noord")}</div>`;return}
  m.innerHTML=`<section class="sec"><div class="sechead"><h3>${tt("history")}</h3></div>`+
    arr.map(o=>`<div style="background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:11px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <b style="font-size:14px">${o.oid||o.id}</b>
        <span style="font-size:11px;font-weight:700;color:var(--ok);background:#E7F5EC;padding:4px 10px;border-radius:8px">${tt("new")}</span>
      </div>
      <div style="font-size:12px;color:var(--ink2);font-weight:500;margin-bottom:6px">${o.at}</div>
      <div style="font-size:13px;line-height:1.5;color:var(--ink2)">${(o.items||[]).slice(0,4).map(l=>"• "+l).join("<br>")}${(o.items||[]).length>4?"<br>…":""}</div>
      <div style="text-align:right;font-weight:800;font-size:14.5px;margin-top:8px">${fmt(o.sum)} soʻm</div>
    </div>`).join("")+`</section>`;
}

/* ---------- sheets ---------- */
let openS=null;
function openSheet(id){
  openS=id; $("#ov").classList.add("on");
  $("#"+id).classList.add("on");
  document.body.style.overflow="hidden";
}
function closeSheet(id){
  $("#"+id).classList.remove("on"); $("#ov").classList.remove("on");
  document.body.style.overflow=""; openS=null;
}
$("#ov").onclick=()=>{if(openS)closeSheet(openS)};
document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>closeSheet(b.dataset.x));

/* ---------- tabs ---------- */
let tab="menu";
function setTab(t){
  tab=t;
  ["menu","cart","ord"].forEach(x=>$("#tab-"+x).classList.toggle("on",x===t));
  if(t==="cart"){ $("#chips").classList.add("hide"); $("#hero").classList.add("hide"); renderCart(); openSheet("cart"); }
  if(t==="ord"){ $("#chips").classList.add("hide"); $("#hero").classList.add("hide"); renderOrders(); window.scrollTo({top:0}); }
  if(t==="menu"){ $("#chips").classList.remove("hide"); $("#hero").classList.remove("hide"); if(openS)closeSheet(openS); render(); }
}
$("#tab-menu").onclick=()=>setTab("menu");
$("#tab-cart").onclick=()=>setTab("cart");
$("#tab-ord").onclick=()=>setTab("ord");

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),1800);
}

/* ---------- search ---------- */
$("#sinput").addEventListener("input",e=>{
  q=e.target.value; $("#sx").classList.toggle("hide",!q);
  if(tab!=="menu")setTab("menu");
  render();
});
$("#sx").onclick=()=>{q="";$("#sinput").value="";$("#sx").classList.add("hide");render();$("#sinput").blur()};
window.addEventListener("scroll",()=>$("#hdr").classList.toggle("sc",scrollY>8),{passive:true});

/* ---------- langs ---------- */
document.querySelectorAll("#langs button").forEach(b=>b.onclick=()=>{
  LANG=b.dataset.l; applyLang(); buildChips(); buildHero(); indexMenu(); render();
  if(openS==="cart")renderCart();
});

/* ---------- init ---------- */
applyLang(); indexMenu(); buildChips(); buildHero(); render(); paintBadge();
</script>
</body>
</html>
